name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmake/**'
      - 'cpp/plugins/**'
      - 'cpp/plugins/common/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'tests/**'
      - 'tests/plugin-quality-gates.json'
      - 'scripts/audit-plugin-safety.py'
      - 'scripts/run-plugin-quality-gate.sh'
      - 'scripts/run-plugin-smoke.sh'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'cmake/**'
      - 'cpp/plugins/**'
      - 'cpp/plugins/common/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'tests/**'
      - 'tests/plugin-quality-gates.json'
      - 'scripts/audit-plugin-safety.py'
      - 'scripts/run-plugin-quality-gate.sh'
      - 'scripts/run-plugin-smoke.sh'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    uses: ./.github/workflows/code-format-check.yml

  plugin-safety:
    needs: format-check
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-windows:
    needs: format-check
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-android:
    needs: format-check
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
